<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact eAIrth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    <a href="index.html">
      <img src="logo.png" alt="Eairth Logo">
    </a>
  </div>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="team.html">Our Team</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="mission-block">
    <h1>Contact eAIrth</h1>
    <p>If you have questions about our research, want to collaborate, or want to learn more, please reach out to us using the form below.</p>
    <form class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Tell us how we can help"></textarea>

      <button type="submit">Send Message</button>
    </form>
  </section>
</main>

</body>
</html>
